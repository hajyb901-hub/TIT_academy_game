<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الحكم - ربط الإضاءة</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between p-6">

    <!-- الهيدر والنتيجة -->
    <header class="text-center mb-6">
        <h1 class="text-3xl font-bold text-amber-400 mb-2">لوحة تحكم الحكم</h1>
        <div class="flex justify-center gap-8 text-lg font-semibold">
            <div class="bg-slate-800 px-6 py-2 rounded-lg border border-slate-700">
                الفريق الأول (A): <span id="scoreA" class="text-emerald-400">0</span>
            </div>
            <div class="bg-slate-800 px-6 py-2 rounded-lg border border-slate-700">
                الفريق الثاني (B): <span id="scoreB" class="text-blue-400">0</span>
            </div>
        </div>
    </header>

    <!-- منطقة عرض السؤال -->
    <main class="max-w-3xl w-full mx-auto bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl flex-grow flex flex-col justify-center items-center text-center my-4">
        <div id="questionContainer" class="w-full">
            <h2 id="questionText" class="text-2xl font-semibold mb-4">في انتظار بدء اللعبة...</h2>
            <div id="ledStatus" class="mt-4 text-sm text-slate-400">حالة الإضاءة: متصل وجاهز</div>
        </div>
    </main>

    <!-- أزرار الحكم -->
    <footer class="max-w-3xl w-full mx-auto grid grid-cols-2 gap-6 mt-4">
        <button onclick="judgeCorrect()" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white text-xl font-bold py-5 rounded-xl shadow-lg transition duration-200">
            إجابة صحيحة (إضاءة خضراء)
        </button>
        <button onclick="judgeWrong()" class="bg-rose-600 hover:bg-rose-500 active:scale-95 text-white text-xl font-bold py-5 rounded-xl shadow-lg transition duration-200">
            إجابة خاطئة (تنبيه أحمر)
        </button>
    </footer>

    <script>
        // -------------------------------------------------------------
        // 1. إعدادات خادم الإضاءة والـ Webhook الخاص بالمتحكم (SP611E / BanlanX)
        // -------------------------------------------------------------
        const LED_SERVER_CONFIG = {
            // الرابط الخارجي أو المحلي الخاص بسكربت خادم الإضاءة (Bridge Server / Webhook)
            endpoint: 'http://localhost:5000/api/led/trigger',
            
            // أنماط الإضاءة المحددة لوحدة التشخيص
            modes: {
                correct: { pattern: 'GREEN_FLASH', speed: 80, brightness: 255, duration: 2000 },
                wrong:   { pattern: 'RED_ALERT',   speed: 100, brightness: 255, duration: 2000 }
            }
        };

        // دالة إرسال أوامر الإضاءة إلى المتحكم
        async function sendLEDCommand(type) {
            const ledStatusEl = document.getElementById('ledStatus');
            const config = LED_SERVER_CONFIG.modes[type];

            if (!config) return;

            try {
                if (ledStatusEl) ledStatusEl.innerText = `جارِ إرسال نمط الإضاءة: ${type === 'correct' ? 'النجاح (أخضر)' : 'التنبيه (أحمر)'}...`;

                // إرسال الأمر عبر طلب POST إلى السكربت الوسيط للتحكم بالمتحكم SP611E
                await fetch(LED_SERVER_CONFIG.endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: type,
                        pattern: config.pattern,
                        speed: config.speed,
                        brightness: config.brightness,
                        duration: config.duration
                    })
                });

                if (ledStatusEl) ledStatusEl.innerText = 'حالة الإضاءة: تم تنفيذ التنسيق بنجاح';
            } catch (error) {
                console.warn('تعذر الوصول المباشر لخادم الإضاءة المحلي:', error);
                if (ledStatusEl) ledStatusEl.innerText = 'حالة الإضاءة: تم إرسال التنبيه عبر Supabase';
            }
        }

        // -------------------------------------------------------------
        // 2. إعدادات Supabase
        // -------------------------------------------------------------
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentRoom = null;
        let roomChannel = null;
        let judgeCurrentTeam = 'A';

        // دالة الحكم بالإجابة الصحيحة
        function judgeCorrect() {
            if (!currentRoom) return;

            // إرسال أمر الإضاءة الخضراء
            sendLEDCommand('correct');

            const pointsEarned = currentRoom.options_shown ? 1 : 2;
            const fields = { 
                last_event: { 
                    type: 'correct', 
                    team: judgeCurrentTeam, 
                    led_mode: LED_SERVER_CONFIG.modes.correct.pattern,
                    nonce: Date.now() 
                } 
            };

            if (judgeCurrentTeam === 'A') {
                fields.score_a = (currentRoom.score_a || 0) + pointsEarned;
            } else {
                fields.score_b = (currentRoom.score_b || 0) + pointsEarned;
            }

            updateRoomFields(fields);

            setTimeout(() => {
                judgeNextQuestion();
            }, 1500);
        }

        // دالة الحكم بالإجابة الخاطئة
        function judgeWrong() {
            if (!currentRoom) return;

            // إرسال أمر الإضاءة الحمراء
            sendLEDCommand('wrong');

            updateRoomFields({ 
                last_event: { 
                    type: 'wrong', 
                    team: judgeCurrentTeam, 
                    led_mode: LED_SERVER_CONFIG.modes.wrong.pattern,
                    nonce: Date.now() 
                } 
            });
        }

        function judgeNextQuestion() {
            console.log("الانتقال للسؤال التالي...");
        }

        async function updateRoomFields(fields) {
            if (!currentRoom) return;
            await supabaseClient
                .from('rooms')
                .update(fields)
                .eq('id', currentRoom.id);
        }

        // الاشتراك في التحديثات اللحظية لـ Supabase
        function subscribeToRoomRealtime(roomId) {
            if (roomChannel) supabaseClient.removeChannel(roomChannel);
            roomChannel = supabaseClient
                .channel('judge-room-' + roomId)
                .on('postgres_changes', {
                    event: 'UPDATE',
                    schema: 'public',
                    table: 'rooms',
                    filter: `id=eq.${roomId}`
                }, (payload) => {
                    const oldRow = currentRoom || {};
                    currentRoom = payload.new;

                    // في حال تم تغيير الحالة من شاشة/جهاز آخر، يتم إرسال إشارة الإضاءة تلقائياً
                    if (currentRoom.last_event && JSON.stringify(currentRoom.last_event) !== JSON.stringify(oldRow.last_event)) {
                        if (currentRoom.last_event.type === 'correct') {
                            sendLEDCommand('correct');
                        } else if (currentRoom.last_event.type === 'wrong') {
                            sendLEDCommand('wrong');
                        }
                    }

                    renderRoomState();
                })
                .subscribe();
        }

        function renderRoomState() {
            if (!currentRoom) return;
            document.getElementById('scoreA').innerText = currentRoom.score_a || 0;
            document.getElementById('scoreB').innerText = currentRoom.score_b || 0;
            if (currentRoom.current_question) {
                document.getElementById('questionText').innerText = currentRoom.current_question;
            }
        }
    </script>
</body>
</html>
